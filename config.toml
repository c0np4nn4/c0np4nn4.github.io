title = "shcho"

# The URL the site will be built for
base_url = "https://shcho.me/"

# theme
theme = "shcho"

# Whether to automatically compile all Sass files in the sass directory
compile_sass = true

# Whether to build a search index to be used later on by a JavaScript library
build_search_index = false

taxonomies = [
    { name = "tags", feed = true },
    { name = "categories", feed = true, paginate_by = 5 },
]

[markdown]
render_emoji = true
bottom_footnotes = true
github_alerts = true

[markdown.highlighting]
style = "inline"
theme = "github-light"

[extra]
show_default_author = false
katex = true

# Single light theme (black & white with a blue accent).
# The body's data-theme attribute is unused; variables live on :root in
# _themes.scss.

main_menu = [
    { name = "CV", url = "cv", trailing_slash = true },
    { name = "Note", url = "note", trailing_slash = true },
]

# socials = [
#     { name = "github", url = "https://github.com/c0np4nn4" },
# ]

[extra.content_security_policy]
enable = false

[extra.responsive_images]
widths = [640, 784, 1280, 1920, 2560]
fallback_width = 1280
