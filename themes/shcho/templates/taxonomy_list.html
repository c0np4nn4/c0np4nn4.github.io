{% extends "base.html" %}

{%- block title -%}
{{ taxonomy.name | capitalize }} | {{ config.title }}
{%- endblock -%}

{% block main %}
<header class="post-header">
    <h1 class="post-title">{{ taxonomy.name | capitalize }}</h1>
</header>

<ul class="tag-list">
    {%- for term in terms %}
    <li>
        <a href="{{ term.permalink | safe }}">{{ term.name }}</a>
        <span class="tag-count">{{ term.page_count }}</span>
    </li>
    {%- endfor %}
</ul>
{% endblock %}
